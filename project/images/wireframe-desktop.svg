<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img" aria-labelledby="deskTitle deskDesc">
  <title id="deskTitle">Desktop wireframe of The First Paycheck home page</title>
  <desc id="deskDesc">Wide layout: header with horizontal nav, two-column hero with headline and calculator preview, a three-column feature grid, and a footer.</desc>

  <rect x="0" y="0" width="800" height="520" fill="#ffffff" stroke="#1B2A4A" stroke-width="2"/>

  <!-- Header -->
  <rect x="16" y="16" width="768" height="56" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="30" y="50" font-size="16" fill="#1B2A4A">LOGO / SITE NAME</text>
  <text x="480" y="50" font-size="12" fill="#1B2A4A">Home</text>
  <text x="550" y="50" font-size="12" fill="#1B2A4A">Basics</text>
  <text x="620" y="50" font-size="12" fill="#1B2A4A">Calculator</text>
  <text x="710" y="50" font-size="12" fill="#1B2A4A">Contact</text>

  <!-- Hero: two columns -->
  <rect x="16" y="88" width="384" height="170" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="32" y="150" font-size="18" fill="#1B2A4A">HERO HEADLINE</text>
  <text x="32" y="176" font-size="11" fill="#3B6E5E">supporting sentence about the site's purpose</text>
  <rect x="32" y="196" width="120" height="28" fill="none" stroke="#C08A2E" stroke-width="1.5"/>
  <text x="48" y="214" font-size="11" fill="#C08A2E">CTA BUTTON</text>

  <rect x="416" y="88" width="368" height="170" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="432" y="112" font-size="12" fill="#1B2A4A">CALCULATOR PREVIEW</text>
  <rect x="432" y="126" width="150" height="18" fill="none" stroke="#2B2B2B"/>
  <rect x="432" y="150" width="150" height="18" fill="none" stroke="#2B2B2B"/>
  <rect x="432" y="174" width="90" height="22" fill="none" stroke="#3B6E5E"/>
  <text x="440" y="189" font-size="10" fill="#3B6E5E">Calculate</text>

  <!-- Three-column feature grid -->
  <rect x="16" y="274" width="245" height="150" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="30" y="296" font-size="12" fill="#1B2A4A">SECTION 1</text>
  <line x1="30" y1="310" x2="245" y2="310" stroke="#2B2B2B"/>
  <line x1="30" y1="326" x2="245" y2="326" stroke="#2B2B2B"/>
  <line x1="30" y1="342" x2="180" y2="342" stroke="#2B2B2B"/>

  <rect x="277" y="274" width="245" height="150" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="291" y="296" font-size="12" fill="#1B2A4A">SECTION 2</text>
  <line x1="291" y1="310" x2="506" y2="310" stroke="#2B2B2B"/>
  <line x1="291" y1="326" x2="506" y2="326" stroke="#2B2B2B"/>
  <line x1="291" y1="342" x2="440" y2="342" stroke="#2B2B2B"/>

  <rect x="538" y="274" width="246" height="150" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="552" y="296" font-size="12" fill="#1B2A4A">SECTION 3</text>
  <line x1="552" y1="310" x2="768" y2="310" stroke="#2B2B2B"/>
  <line x1="552" y1="326" x2="768" y2="326" stroke="#2B2B2B"/>
  <line x1="552" y1="342" x2="700" y2="342" stroke="#2B2B2B"/>

  <!-- Footer -->
  <rect x="16" y="442" width="768" height="62" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="30" y="478" font-size="12" fill="#1B2A4A">FOOTER: links / references page / social</text>
</svg>
