<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img" aria-labelledby="mobileTitle mobileDesc">
  <title id="mobileTitle">Mobile wireframe of The First Paycheck home page</title>
  <desc id="mobileDesc">Stacked single-column layout: logo bar with menu icon, hero block, three stacked content blocks, and footer.</desc>

  <rect x="0" y="0" width="320" height="640" fill="#ffffff" stroke="#1B2A4A" stroke-width="2"/>

  <!-- Header / logo bar -->
  <rect x="8" y="8" width="304" height="48" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="37" font-size="14" fill="#1B2A4A">LOGO / SITE NAME</text>
  <rect x="270" y="20" width="24" height="4" fill="#1B2A4A"/>
  <rect x="270" y="28" width="24" height="4" fill="#1B2A4A"/>
  <rect x="270" y="36" width="24" height="4" fill="#1B2A4A"/>

  <!-- Hero -->
  <rect x="8" y="64" width="304" height="140" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="130" font-size="14" fill="#1B2A4A">HERO HEADLINE</text>
  <text x="18" y="150" font-size="10" fill="#3B6E5E">short supporting line</text>
  <rect x="18" y="164" width="90" height="24" fill="none" stroke="#C08A2E" stroke-width="1.5"/>
  <text x="30" y="180" font-size="10" fill="#C08A2E">CTA BUTTON</text>

  <!-- Content block 1 -->
  <rect x="8" y="212" width="304" height="110" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="232" font-size="12" fill="#1B2A4A">SECTION 1</text>
  <line x1="18" y1="244" x2="294" y2="244" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="260" x2="294" y2="260" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="276" x2="220" y2="276" stroke="#2B2B2B" stroke-width="1"/>

  <!-- Content block 2 -->
  <rect x="8" y="330" width="304" height="110" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="350" font-size="12" fill="#1B2A4A">SECTION 2</text>
  <line x1="18" y1="362" x2="294" y2="362" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="378" x2="294" y2="378" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="394" x2="220" y2="394" stroke="#2B2B2B" stroke-width="1"/>

  <!-- Content block 3 -->
  <rect x="8" y="448" width="304" height="110" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="468" font-size="12" fill="#1B2A4A">SECTION 3</text>
  <line x1="18" y1="480" x2="294" y2="480" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="496" x2="294" y2="496" stroke="#2B2B2B" stroke-width="1"/>
  <line x1="18" y1="512" x2="220" y2="512" stroke="#2B2B2B" stroke-width="1"/>

  <!-- Footer -->
  <rect x="8" y="566" width="304" height="66" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="18" y="592" font-size="10" fill="#1B2A4A">FOOTER: links / references / social</text>
</svg>
